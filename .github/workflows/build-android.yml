name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet publish FloatingPanelCSharp.csproj -f net9.0-android -c Debug -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingPanelDemo-Android-APK
          path: bin/Debug/net9.0-android/publish/*.apk
